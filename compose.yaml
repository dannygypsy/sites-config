# /opt/sites/compose.yaml — all personal sites on sites-nyc3-1
# Repo: sites-config. See README.md for how to deploy changes.
#
# Only Caddy publishes ports. Apps are reachable only through Caddy
# (Docker bypasses ufw for published ports, so never add `ports:` to an app).

name: sites

services:
  caddy:
    # Standard Caddy plus two Cloudflare plugins, built on the server from
    # caddy-image/Dockerfile. To update Caddy itself:
    #   docker compose build --pull caddy && docker compose up -d caddy
    build: ./caddy-image
    image: sites-caddy:local
    restart: unless-stopped
    env_file: ./env/caddy.env     # CLOUDFLARE_API_TOKEN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # Mount the FOLDER, not the single file: git pull replaces files rather than
      # editing them, and a single-file mount would keep showing Caddy the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data        # certificates — keep this volume
      - caddy_config:/config
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Wingnut Trading intranet — wtc.wingnutstables.com
  # ---------------------------------------------------------------
  wtc-intranet:
    image: ghcr.io/dannygypsy/wtc-intranet:3.0.7
    restart: unless-stopped
    env_file: ./env/wtc-intranet.env
    environment:
      NODE_ENV: production
      ALLOWED_EMAILS: "ixdaniel@mac.com,ixdaniel@me.com,danny@wingnutstables.com"
    volumes:
      - ./certs:/etc/ssl/do:ro    # DO database CA, same path as on k8s
    expose:
      - "3000"
    mem_limit: 128m               # k8s limit, which it ran under fine
    cpus: 0.5

  # ---------------------------------------------------------------
  # FAD Retreat — fadretreat.com, www.fadretreat.com, test.fadretreat.com
  # ---------------------------------------------------------------
  fadretreat:
    image: ghcr.io/dannygypsy/fadretreat:1.0.38
    restart: unless-stopped
    env_file: ./env/fadretreat.env
    environment:
      NODE_ENV: production
      REQUEST_LOG_FORMAT: dev
      RETREAT_GROOP: "22"
      EVENT_START: "Sep 19, 2027 21:00:00"
      EVENT_END: "Sep 26, 2027 15:00:00"
      DB_PORT: "25060"
      DB_NAME: groopzone
      DB_SSL: "true"
      DB_SSL_CA: /etc/ssl/do/ca-certificate.crt
    volumes:
      - ./certs:/etc/ssl/do:ro    # DO database CA
    expose:
      - "3001"
    mem_limit: 256m               # k8s limit
    cpus: 0.5

  # ---------------------------------------------------------------
  # Wingnut Hunt — hunt.wingnutstables.com
  # Only runs during events (profile "events"):
  #   docker compose --profile events up -d wingnut-hunt
  #   docker compose stop wingnut-hunt
  # ---------------------------------------------------------------
  wingnut-hunt:
    image: ghcr.io/dannygypsy/wingnut-hunt:0.1.6
    profiles: ["events"]
    restart: unless-stopped
    env_file: ./env/wingnut-hunt.env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    mem_limit: 256m               # Next.js; k8s limit was 128m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
