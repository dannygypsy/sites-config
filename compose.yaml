# /opt/sites/compose.yaml — all personal sites on sites-nyc3-1
# Repo: sites-config. See README.md for how to deploy changes.
#
# Only Caddy publishes ports. Apps are reachable only through Caddy
# (Docker bypasses ufw for published ports, so never add `ports:` to an app).

name: sites

services:
  caddy:
    # Standard Caddy plus two Cloudflare plugins, built on the server from
    # caddy-image/Dockerfile. To update Caddy itself:
    #   docker compose build --pull caddy && docker compose up -d caddy
    build: ./caddy-image
    image: sites-caddy:local
    restart: unless-stopped
    env_file: ./env/caddy.env     # CLOUDFLARE_API_TOKEN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # Mount the FOLDER, not the single file: git pull replaces files rather than
      # editing them, and a single-file mount would keep showing Caddy the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data        # certificates — keep this volume
      - caddy_config:/config
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Wingnut Trading intranet — wtc.wingnutstables.com
  # ---------------------------------------------------------------
  wtc-intranet:
    image: ghcr.io/dannygypsy/wtc-intranet:3.0.7
    restart: unless-stopped
    env_file: ./env/wtc-intranet.env
    environment:
      NODE_ENV: production
      ALLOWED_EMAILS: "ixdaniel@mac.com,ixdaniel@me.com,danny@wingnutstables.com"
    volumes:
      - ./certs:/etc/ssl/do:ro    # DO database CA, same path as on k8s
    expose:
      - "3000"
    mem_limit: 128m               # k8s limit, which it ran under fine
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
